; Dev project for the Sensor2Cloud library.
; Builds the sketches in examples/ against the library in src/ (linked via symlink, so edits apply immediately).
; WiFi / key / server URL live in include/secrets.h (copy include/secrets.example.h).
;
;   pio run -e basic -t upload -t monitor      -> examples/basic
;   pio run -e hwtest -t upload -t monitor     -> examples/hardware_test (pair with server/test/check-hwtest.js)

[platformio]
src_dir = examples
default_envs = basic

[env]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://.

[env:basic]
build_src_filter = +<basic/>

[env:hwtest]
build_src_filter = +<hardware_test/>
